[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-downloader-bot"
version = "0.1.0"
description = "Universal Link Downloader Telegram Bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyrogram>=2.0.106",
    "tgcrypto>=1.2.5",
    "aiohttp>=3.11.0",
    "aiofiles>=24.1.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.1",
    "cryptography>=42.0.0",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
    "motor>=3.3.0",
    "psutil>=5.9.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --asyncio-mode=auto"
pythonpath = ["."]
testpaths = [
    "tests",
]
python_files = ["test_*.py"]
